name: Build Mini-UNA APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ci-log]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev

      - name: Build Cactus Android engine
        run: |
          git clone --depth 1 https://github.com/cactus-compute/cactus.git /tmp/cactus
          cd /tmp/cactus
          source ./setup
          cactus build --android
          test -f android/libcactus_engine.so
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp android/libcactus_engine.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Download Needle 3 weights
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            "https://huggingface.co/Cactus-Compute/needle3/resolve/main/needle3.cact?download=true" \
            -o app/src/main/assets/needle3.cact
          test -s app/src/main/assets/needle3.cact

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          exit ${PIPESTATUS[0]}

      - name: Publish build diagnostic to repository
        if: steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p ci
          {
            echo "# Mini-UNA CI build failure"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_RUN_ID"
            echo
            echo "## Gradle output"
            echo
            echo '```text'
            tail -n 400 "$RUNNER_TEMP/gradle-build.log"
            echo '```'
          } > ci/build-error.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/build-error.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[ci-log] capture Gradle build error"
          git push

      - name: Fail build after diagnostic capture
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-una-debug
          path: app/build/outputs/apk/debug/app-debug.apk
