name: Build Mini-UNA APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: mini-una-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev

      - name: Build Cactus Android engine
        run: |
          git clone --depth 1 https://github.com/cactus-compute/cactus.git /tmp/cactus
          cd /tmp/cactus
          source ./setup
          cactus build --android
          test -f android/libcactus_engine.so
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp android/libcactus_engine.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Download Needle 3 weights
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            "https://huggingface.co/Cactus-Compute/needle3/resolve/main/needle3.cact?download=true" \
            -o app/src/main/assets/needle3.cact
          test -s app/src/main/assets/needle3.cact

      - name: Download Needle server binary
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            "https://huggingface.co/Cactus-Compute/needle3/resolve/main/android-arm64/needle?download=true" \
            -o app/src/main/assets/needle
          test -s app/src/main/assets/needle
          # Дублируем в jniLibs как libneedle.so: установщик сохраняет
          # exec-права в nativeLibraryDir (надёжнее filesDir на части прошивок).
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp app/src/main/assets/needle app/src/main/jniLibs/arm64-v8a/libneedle.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Strip native libraries
        run: |
          sudo apt-get install -y llvm
          llvm-strip --strip-debug app/src/main/jniLibs/arm64-v8a/*.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Set up signing keystore
        run: |
          echo "$MINIUNA_KEYSTORE_B64" | base64 -d > /tmp/mini-una-release.p12
          test -s /tmp/mini-una-release.p12
        env:
          MINIUNA_KEYSTORE_B64: ${{ secrets.MINIUNA_KEYSTORE_B64 }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (routing)
        run: bash gradlew :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        run: bash gradlew assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: /tmp/mini-una-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.MINIUNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIUNA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIUNA_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-una-release
          path: app/build/outputs/apk/release/app-release.apk
